<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GlobalRadio Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    cast-media-player { --theme-hue: 200; }
    #liveTitle { font-size: 2em; color: white; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <cast-media-player id="player"></cast-media-player>
  <div id="liveTitle">Live radio</div>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    // Player de base
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        request.media.streamType = cast.framework.messages.StreamType.LIVE;
        return request;
      }
    );

    // Écoute des messages custom
    context.addCustomMessageListener('urn:x-cast:globalradio.meta', (event) => {
      const data = event.data;

      // Mise à jour du titre live (subtitle du player natif)
      const media = playerManager.getMediaInformation();
      if (media && media.metadata) {
        media.metadata.subtitle = data.title || "Live radio";
        media.metadata.title = data.station || "GlobalRadio.top";
        if (data.logo) {
          media.metadata.images = [{ url: data.logo }];
        }
        playerManager.setMediaInformation(media, { autoplay: true });
      }

      // Mise à jour d’un élément custom (plus visible sur certaines TV)
      document.getElementById("liveTitle").textContent = data.title || "Live radio";
    });

    context.start({ statusText: "GlobalRadio.top ready" });
  </script>
</body>
</html>
