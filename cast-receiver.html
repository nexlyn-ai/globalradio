<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{margin:0;height:100%;background:#050710;color:#e7eefc;font-family:system-ui}
    .wrap{position:absolute;inset:0;display:grid;place-items:center;padding:22px}
    .card{
      width:min(92vw,980px);
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;
      background:rgba(8,10,22,.82);
      backdrop-filter:blur(14px);
      padding:22px;
      box-shadow:0 30px 120px rgba(0,0,0,.55);
      display:flex; gap:18px; align-items:center;
    }
    .logo{
      width:96px;height:96px;border-radius:22px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      display:grid;place-items:center;overflow:hidden;flex:0 0 auto;
    }
    .logo img{width:78%;height:78%;object-fit:contain;display:block}
    .title{font-weight:900;font-size:28px;line-height:1.1}
    .sub{margin-top:10px;font-size:18px;opacity:.92;font-style:italic}
    .hint{margin-top:16px;opacity:.6;font-size:13px}
    cast-media-player{display:none;} /* audio only, UI perso */
  </style>

  <!-- CAF Receiver -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo"><img id="lg" alt="logo" /></div>
      <div>
        <div class="title" id="st">GlobalRadio.top</div>
        <div class="sub" id="ti">Waiting for cast…</div>
        <div class="hint" id="hi">Casting • metadata live</div>
      </div>
    </div>
  </div>

  <!-- required element for CAF playback (even hidden) -->
  <cast-media-player></cast-media-player>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    const NS = "urn:x-cast:globalradio.meta";
    const bus = context.getCastMessageBus(NS);

    const $st = document.getElementById("st");
    const $ti = document.getElementById("ti");
    const $lg = document.getElementById("lg");
    const $hi = document.getElementById("hi");

    const FALLBACK_LOGO = "https://globalradio.top/assets/globalradio-logo.jpg";

    function setUI({station, title, logo}){
      if (station) $st.textContent = station;
      if (title)   $ti.textContent = title;
      if (logo)    $lg.src = logo;
    }

    // 1) Messages live (titre live)
    bus.onMessage = (event) => {
      try{
        const msg = JSON.parse(event.data || "{}");
        setUI({
          station: msg.station,
          title: msg.title,
          logo: msg.logo
        });
      }catch(e){}
    };

    // 2) Intercepte le LOAD pour récupérer customData (station/logo)
    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (loadRequestData) => {
        try{
          const cd = loadRequestData?.media?.customData || {};
          setUI({
            station: cd.station || "Radio",
            title: cd.title || "Live radio",
            logo: cd.logo || FALLBACK_LOGO
          });
          $hi.textContent = "Playing • Custom Receiver";
        }catch(e){}
        return loadRequestData;
      }
    );

    // 3) Quand le media est chargé, essaie aussi de lire metadata “classique”
    playerManager.addEventListener(
      cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
      () => {
        try{
          const info = playerManager.getMediaInformation();
          const md = info?.metadata || {};
          const station = md.title || md.artist || "Radio";
          const title = md.subtitle || md.albumName || "Live radio";
          const img = (md.images && md.images[0] && md.images[0].url) ? md.images[0].url : FALLBACK_LOGO;
          setUI({station, title, logo: img});
        }catch(e){}
      }
    );

    context.start();
  </script>
</body>
</html>
