<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GlobalRadio</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body { margin:0; background:#0b1227; color:white; font-family:system-ui; overflow:hidden; }
    cast-media-player { width:100vw; height:100vh; }
    #overlay {
      position:absolute; bottom:100px; left:0; right:0; text-align:center; z-index:999; pointer-events:none;
      text-shadow:0 2px 10px black;
    }
    #station { font-size:3em; font-weight:bold; margin:0; }
    #title { font-size:2.2em; margin:15px 0 0; opacity:0.9; }
  </style>
</head>
<body>
  <cast-media-player autoplay></cast-media-player>
  <div id="overlay">
    <div id="station">GlobalRadio.top</div>
    <div id="title">Chargement...</div>
  </div>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const player = document.querySelector('cast-media-player');

    // Force autoplay et LIVE sur tout LOAD
    player.addEventListener('load', () => {
      player.media.streamType = cast.framework.messages.StreamType.LIVE;
      player.autoplay = true;
      player.play();
    }, { once: false });

    // Messages custom pour titre
    context.addCustomMessageListener('urn:x-cast:globalradio.meta', event => {
      const data = event.data;
      document.getElementById('station').textContent = data.station || 'Radio';
      document.getElementById('title').textContent = data.title || 'Live radio';
      
      // Mise à jour metadata native
      const media = player.media;
      if (media) {
        media.metadata = media.metadata || {};
        media.metadata.title = data.station || 'Radio';
        media.metadata.subtitle = data.title || 'Live radio';
        if (data.logo) media.metadata.images = [{ url: data.logo }];
        player.media = media; // force refresh
      }
    });

    context.start();
  </script>
</body>
</html>
